<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1626"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#53f0c6"/>
      <stop offset="1" stop-color="#14b8a0"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1ec8e8"/>
      <stop offset="1" stop-color="#0c85b8"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#134e63"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="edgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS squircle -->
  <g filter="url(#softShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <!-- floor shadow under cube -->
  <ellipse cx="512" cy="775" rx="245" ry="46" fill="#000000" opacity="0.35"/>

  <!-- isometric cube -->
  <g stroke="#9ef3ff" stroke-width="9" stroke-linejoin="round" filter="url(#edgeGlow)">
    <!-- left face -->
    <polygon points="322,410 512,520 512,740 322,630" fill="url(#leftFace)"/>
    <!-- right face -->
    <polygon points="702,410 512,520 512,740 702,630" fill="url(#rightFace)"/>
    <!-- top face -->
    <polygon points="512,300 702,410 512,520 322,410" fill="url(#topFace)"/>
  </g>

  <!-- code glyph on right face (isometric plane) -->
  <g transform="translate(512,545) skewY(-15)">
    <g stroke="#eafffb" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
      <polyline points="62,53 30,85 62,117"/>
      <polyline points="128,53 160,85 128,117"/>
      <line x1="107" y1="43" x2="83" y2="127"/>
    </g>
  </g>

  <!-- subtle top-face grid hint -->
  <g stroke="#0d9488" stroke-width="4" opacity="0.5">
    <line x1="417" y1="355" x2="607" y2="465"/>
    <line x1="607" y1="355" x2="417" y2="465"/>
  </g>
</svg>
