[package]
name = "cali-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
bytes = "1"
futures = "0.3"
globset = "0.4"
image = "0.25"
libc = "0.2"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.24"
tower-http = { version = "0.5", features = ["cors", "fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-normalization = "0.1.25"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Window enumeration for computer use. CGWindowListCopyWindowInfo is pure C and
# synchronous; the ScreenCaptureKit wrapper crates build and link Swift, which
# would drag a third language into a Rust + TypeScript repo for one call.
core-graphics = { version = "0.24", features = ["highsierra"] }  # highsierra: CGEvent::new_scroll_event
core-foundation = "0.10"
# For ForeignType::as_ptr on CGEvent, to hand a raw CGEventRef to the
# CGEventPostToPid extern that `core-graphics` does not expose.
foreign-types = "0.5"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
